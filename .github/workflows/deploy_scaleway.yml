name: Deploy on scaleway

on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load environment config
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            cat deploy/production.env >> "$GITHUB_ENV"
          else
            cat deploy/staging.env >> "$GITHUB_ENV"
          fi

      - name: Build and push image
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          IMAGE="rg.${SCW_REGION}.scw.cloud/${SCW_REGISTRY_NAMESPACE}/web:${GITHUB_REF_NAME}-${GITHUB_SHA}"
          echo "$SCW_SECRET_KEY" | docker login "rg.${SCW_REGION}.scw.cloud" -u nologin --password-stdin
          docker build \
            --build-arg ALLOW_INDEXING="$ALLOW_INDEXING" \
            --build-arg NEXT_PUBLIC_CONTACT_EMAIL="$NEXT_PUBLIC_CONTACT_EMAIL" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Serverless Container
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          curl --fail-with-body -X PATCH \
            "https://api.scaleway.com/containers/v1beta1/regions/${SCW_REGION}/containers/${SCW_CONTAINER_ID}" \
            -H "X-Auth-Token: $SCW_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"registry_image\": \"${IMAGE}\", \"redeploy\": true}"
